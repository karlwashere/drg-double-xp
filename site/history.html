<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>History · DRG Double XP</title>
  <meta name="description" content="History of Deep Rock Galactic missions (Double XP and every other mutator), with search.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="header">
    <a class="brand" href="./">
      <span class="brand-xp">2×XP</span>
      <span class="brand-name">Deep Rock Galactic</span>
    </a>
  </header>

  <main>
    <form id="filters" class="filters" aria-label="Filters">
      <div class="multi">
        <span class="multi-title" id="mission-title">Mission type</span>
        <details>
          <summary aria-describedby="mission-title">All</summary>
          <div class="multi-panel" role="group" aria-labelledby="mission-title">
            <label class="multi-all"><input type="checkbox" data-all checked> All</label>
            <div class="multi-options"></div>
          </div>
        </details>
        <input type="hidden" name="mission" value="">
      </div>
      <div class="multi">
        <span class="multi-title" id="biome-title">Biome</span>
        <details>
          <summary aria-describedby="biome-title">All</summary>
          <div class="multi-panel" role="group" aria-labelledby="biome-title">
            <label class="multi-all"><input type="checkbox" data-all checked> All</label>
            <div class="multi-options"></div>
          </div>
        </details>
        <input type="hidden" name="biome" value="">
      </div>
      <div class="multi">
        <span class="multi-title" id="mutator-title">Mutator</span>
        <details>
          <summary aria-describedby="mutator-title">All</summary>
          <div class="multi-panel" role="group" aria-labelledby="mutator-title">
            <label class="multi-all"><input type="checkbox" data-all checked> All</label>
            <div class="multi-options"></div>
          </div>
        </details>
        <input type="hidden" name="mutator" value="">
      </div>
      <div class="multi">
        <span class="multi-title" id="warning-title">Warning</span>
        <details>
          <summary aria-describedby="warning-title">All</summary>
          <div class="multi-panel" role="group" aria-labelledby="warning-title">
            <label class="multi-all"><input type="checkbox" data-all checked> All</label>
            <div class="multi-options"></div>
            <label class="multi-mode"><input type="checkbox" name="warning_mode" value="all" data-mode>
              Must have all selected</label>
          </div>
        </details>
        <input type="hidden" name="warning" value="">
      </div>
      <label>Length
        <select name="length">
          <option value="">All</option>
          <option value="1">Short</option>
          <option value="2">Medium</option>
          <option value="3">Long</option>
        </select>
      </label>
      <label>Season
        <select name="season"><option value="">All</option></select>
      </label>
      <button type="button" id="reset" class="link-button">Reset</button>
    </form>

    <nav class="tabs" aria-label="Views">
      <a href="./">Upcoming</a>
      <a href="history" aria-current="page">History</a>
    </nav>

    <h1 id="history-title" class="eyebrow">Double XP mission history</h1>

    <p id="summary" class="summary" aria-live="polite"></p>
    <div id="results"><p class="loading">Loading…</p></div>
    <div class="pagination">
      <button type="button" id="more" class="button" hidden>Show more</button>
    </div>
  </main>

  <footer class="footer">
    <p>Data: <a href="https://doublexp.net" rel="noopener">doublexp.net</a>. Times shown in your device's time zone.</p>
    <p>Fan site, not affiliated with Ghost Ship Games.</p>
  </footer>

  <script src="config.js"></script>
  <script src="static-api.js"></script>
  <script src="common.js"></script>
  <script src="history.js"></script>
</body>
</html>
